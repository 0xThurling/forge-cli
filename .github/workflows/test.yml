name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end suite (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the toolchain the suite drives
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ tar python3

      # Builds the CLI and runs every scenario against a throwaway workspace.
      # The ../fp integration scenarios skip here (no sibling checkout); the
      # rest cover the commands, the dependency channels, the generated CMake
      # and the Lua API.
      - name: Run the end-to-end suite
        run: test/run.sh

  # Portability canary: the suite is bash + cmake + git + python3, so it should
  # run anywhere. This job starts with the scenarios that need nothing beyond
  # that toolchain; widen the list as more are verified on macOS.
  e2e-macos:
    name: End-to-end suite (macOS subset)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the toolchain the suite drives
        run: brew install cmake ninja

      - name: Run the portable scenarios
        run: |
          test/run.sh \
            10-build 20-scaffold 21-doctor 22-project-commands 24-resources \
            25-clean 26-errors 40-doctor-layout 44-run-command 48-cli-surface \
            51-new-contents 61-json-output 69-doctor-fix-completions 73-lua-sections
